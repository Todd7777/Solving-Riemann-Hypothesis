[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rh"
version = "0.1.0"
description = "Research platform for the Riemann Hypothesis: rigorous numerics for the classical equivalent criteria, zero statistics, and verification machinery."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "mpmath>=1.3",
  "sympy>=1.12",
  "python-flint>=0.6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
